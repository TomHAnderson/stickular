<h3>5.</h3>

<form method="POST" action="https://www.sandbox.paypal.com/cgi-bin/webscr">
  <button type="submit" onClick="this.form.submit()">
    <img 
      src="http://www.paypal.com/en_US/i/btn/x-click-but01.gif" 
      alt="Make payments with PayPal - it's fast, free and secure!"
    >
  </button>

    <input type="text" name="add" value="1">
    <input type="text" name="upload" value="1">
    <input type="text" name="cmd"  value="_cart">
    <input type="text" name="business" value="contact@apiskeletons.com">
    <input type="text" name="currency_code" value="USD">
    <input type="text" name="item_name" value="Stickular">
    <input type="text" name="amount" [value]="cartService.totalCost()">
    <input type="text" name="return" value="https://stickular.com">
    <input type="text" name="quantity" [value]="items.length">

  <ng-container *ngFor="let item of items | keyvalue">
      <input type="text" name="item_name_{{ parseInt(item.key) + 1 }}" [value]="item.value.getName()"><br>
      <input type="text" name="item_number_{{ parseInt(item.key) + 1 }}" [value]="item.value.getId()"><br>
      <input type="text" name="amount_{{ parseInt(item.key) + 1 }}" [value]="item.value.getPrice()"><br>
  </ng-container>


</form>
